<script>window.CAL_BUILD="20261030183243";
/* Calendar app: local-first store on this device + sync with a private GitHub repository.
   Same interface the page expects from claude.use("db"): collection(c).onSnapshot(cb) / doc(id).set(d) / doc(id).delete().
   Data lives in data/<collection>.json in the repository: one object, id -> document; every document carries _t (last change,
   ms since 1970) and a deleted document is kept for a while as {_del:true,_t}. */
(function(){
const COLLS=["items","lists","goals","habits","weeks","recipes","settings","subs","subcache"];
const P="cal1.";
const ls={get:k=>{try{return localStorage.getItem(P+k)}catch(_){return null}},set:(k,v)=>{try{localStorage.setItem(P+k,v);return true}catch(_){return false}},del:k=>{try{localStorage.removeItem(P+k)}catch(_){}}};
const conf=()=>{try{return Object.assign({repo:window.CAL_REPO||"",branch:"main"},JSON.parse(ls.get("conf")||"{}"))}catch(_){return {repo:window.CAL_REPO||"",branch:"main"}}};
const setConf=c=>ls.set("conf",JSON.stringify(c));
const mem={},dirty={},shas=JSON.parse(ls.get("shas")||"{}");
function load(c){try{mem[c]=JSON.parse(ls.get("d."+c)||"{}")}catch(_){mem[c]={}}try{dirty[c]=new Set(JSON.parse(ls.get("x."+c)||"[]"))}catch(_){dirty[c]=new Set()}}
function persist(c){const ok=ls.set("d."+c,JSON.stringify(mem[c]))&&ls.set("x."+c,JSON.stringify([...dirty[c]]));if(!ok)status("error","This device is out of storage space.")}
COLLS.forEach(load);
const listeners={};
const clean=d=>{const x=Object.assign({},d);delete x._t;delete x._del;return x};
function snap(c){return {docs:Object.entries(mem[c]||{}).filter(([,d])=>d&&!d._del).map(([id,d])=>({id,data:()=>clean(d)}))}}
function emit(c){for(const cb of (listeners[c]||[]))try{cb(snap(c))}catch(e){console.error(e)}}
function touch(c,id,doc){if(!mem[c])load(c);mem[c][id]=doc;dirty[c].add(id);persist(c);emit(c);status();queueSync(2500)}
const db={collection:c=>{if(!mem[c])load(c);return {
  onSnapshot:(cb)=>{(listeners[c]=listeners[c]||[]).push(cb);setTimeout(()=>cb(snap(c)),0);return()=>{listeners[c]=(listeners[c]||[]).filter(x=>x!==cb)}},
  doc:id=>({set:async d=>touch(c,id,Object.assign({},d,{_t:Date.now()})),delete:async()=>touch(c,id,{_del:true,_t:Date.now()})})}}};
window.claude={use:async n=>n==="db"?db:n==="user"?{can:async()=>true,isOwner:()=>true}:null};

/* ---------- GitHub sync ---------- */
const API="https://api.github.com";
function b64enc(str){const b=new TextEncoder().encode(str);let s="";for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(t){const s=atob(String(t).replace(/\s/g,""));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b)}
async function gh(path,opt){const c=conf();opt=opt||{};const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),20000);
  try{return await fetch(API+path,Object.assign({},opt,{signal:ctl.signal,cache:"no-store",headers:Object.assign({Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},opt.headers||{})}))}finally{clearTimeout(to)}}
const fmt=o=>"{\n"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+JSON.stringify(o[k])).join(",\n")+"\n}\n";
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const TOMB_DAYS=120;
function merge(c,remote){const L=mem[c],D=dirty[c],out={};const ids=new Set([...Object.keys(L),...Object.keys(remote)]);const old=Date.now()-TOMB_DAYS*864e5;
  for(const id of ids){const a=L[id],b=remote[id];let w;
    if(!b)w=D.has(id)?a:null;                       // gone from the repository and not changed here: deleted elsewhere
    else if(!a||!D.has(id))w=b;                     // not changed here: the repository wins (also when Claude edited it)
    else w=(a._t||0)>=(b._t||0)?a:b;                // changed on both sides: the newest change wins
    if(w&&w._del&&(w._t||0)<old)w=null;
    if(w)out[id]=w}
  return out}
let syncing=false,again=false,lastOk=+ls.get("lastok")||0,lastErr="";
async function syncOnce(){const c=conf();if(!c.token||!c.repo)return status("setup");if(!navigator.onLine)return status("offline");
  const br=c.branch||"main";
  let listing={};const r=await gh("/repos/"+c.repo+"/contents/data?ref="+encodeURIComponent(br));
  if(r.status===401)throw new Error("GitHub does not accept this key. Paste it again in full, or make a new one.");
  if(r.status===403||r.status===404&&!(await gh("/repos/"+c.repo)).ok)throw new Error("The key works but has no access to "+c.repo+". Give the key access to that repository (Contents: Read and write).");
  if(r.status===200){for(const f of await r.json())listing[f.name.replace(/\.json$/,"")]=f.sha}else if(r.status!==404)throw new Error("GitHub answered "+r.status);
  for(const coll of COLLS){
    if(listing[coll]&&listing[coll]===shas[coll]&&!dirty[coll].size)continue;
    for(let attempt=0;attempt<4;attempt++){
      let remote={},sha=null;
      if(listing[coll]||attempt>0){const g=await gh("/repos/"+c.repo+"/contents/data/"+coll+".json?ref="+encodeURIComponent(br));
        if(g.status===200){const j=await g.json();sha=j.sha;let txt=j.content&&j.encoding==="base64"?b64dec(j.content):null;
          if(txt==null){const raw=await gh("/repos/"+c.repo+"/contents/data/"+coll+".json?ref="+encodeURIComponent(br),{headers:{Accept:"application/vnd.github.raw"}});txt=await raw.text()}
          try{remote=JSON.parse(txt||"{}")}catch(_){throw new Error("data/"+coll+".json is not valid JSON in the repository")}}
        else if(g.status!==404)throw new Error("GitHub answered "+g.status)}
      const out=merge(coll,remote);
      if(!same(out,remote)){const body={message:"Calendar: "+coll+" ("+(navigator.userAgent.includes("Mobile")?"phone":"computer")+")",content:b64enc(fmt(out)),branch:br};if(sha)body.sha=sha;
        const p=await gh("/repos/"+c.repo+"/contents/data/"+coll+".json",{method:"PUT",body:JSON.stringify(body)});
        if(p.status===409||p.status===422){listing[coll]=true;continue}
        if(!p.ok)throw new Error("Saving to GitHub failed ("+p.status+")");
        sha=(await p.json()).content.sha}
      // changes made on this device while the sync was under way stay (they go out with the next sync)
      const fin=Object.assign({},out),still=new Set();
      for(const id of dirty[coll]){const l=mem[coll][id];if(l&&(!out[id]||(l._t||0)>(out[id]._t||0))){fin[id]=l;still.add(id)}}
      const changed=!same(fin,mem[coll]);mem[coll]=fin;dirty[coll]=still;persist(coll);shas[coll]=still.size?null:sha;if(changed)emit(coll);if(still.size)again=true;break}}
  ls.set("shas",JSON.stringify(shas));lastOk=Date.now();ls.set("lastok",String(lastOk));lastErr="";status()}
async function sync(){if(syncing){again=true;return}syncing=true;status("syncing");
  try{await syncOnce()}catch(e){lastErr=String(e&&e.message||e);syncing=false;status(navigator.onLine?"error":"offline")}
  syncing=false;if(state==="syncing")status();if(again){again=false;setTimeout(sync,300)}}
let qt=null;function queueSync(ms){clearTimeout(qt);qt=setTimeout(sync,ms||0)}
window.addEventListener("online",()=>queueSync(500));window.addEventListener("offline",()=>status("offline"));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)queueSync(300)});
setInterval(()=>{if(!document.hidden)sync()},90*1000);

/* ---------- status + setup ---------- */
const pending=()=>COLLS.reduce((n,c)=>n+dirty[c].size,0);
let state="";
function status(s){if(s)state=s;else state=syncing?"syncing":!conf().token?"setup":!navigator.onLine?"offline":lastErr?"error":"ok";
  const b=document.getElementById("syncBtn");if(!b)return;const n=pending();
  const t={ok:n?"↻ "+n:"✓",syncing:"↻",offline:"Offline"+(n?" · "+n:""),error:"⚠ Sync",setup:"Connect"}[state];
  b.textContent=t;b.dataset.state=state;
  b.title=state==="ok"?(n?n+" changes waiting":"Synced "+(lastOk?new Date(lastOk).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):"")):state==="offline"?"Offline: changes are kept on this device and sync when you are online"+(n?" ("+n+" waiting)":""):state==="error"?lastErr:state==="setup"?"Connect this device to the data":"Syncing…"}
function el(tag,props,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props||{})){if(k==="text")e.textContent=v;else if(k.startsWith("on"))e[k]=v;else if(v!=null&&v!==false)e.setAttribute(k,v===true?"":v)}for(const c of kids.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e}
function openSync(){const c=conf();const ov=el("div",{class:"overlay"});const sh=el("div",{class:"sheet",role:"dialog","aria-label":"Sync"});
  const close=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)close()};
  const repo=el("input",{type:"text",value:c.repo||"",placeholder:"username/calendar-data",autocapitalize:"off",autocomplete:"off",spellcheck:"false"});
  const tok=el("input",{type:"text",value:c.token||"",placeholder:"github_pat_…",autocomplete:"off",autocorrect:"off",autocapitalize:"off",spellcheck:"false",name:"cal-key-"+Math.random().toString(36).slice(2,6)});
  const hint=el("p",{class:"why",style:"margin:0;min-height:1.2em"});const check=()=>{const v=tok.value.replace(/\s+/g,"");hint.textContent=!v?"":/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(v)?"Key looks complete ("+v.length+" characters).":"This does not look like a whole key: it should start with github_pat_ and be about 93 characters long (now "+v.length+").";hint.style.color=/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(v)||!v?"":"var(--danger)"};tok.oninput=check;check();
  const n=pending();
  const info=el("p",{class:"why",text:!c.token?"Paste the key once on each device. Everything stays on this device and syncs with the private repository when there is internet.":(lastErr?"Last error: "+lastErr:"Last sync: "+(lastOk?new Date(lastOk).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"never"))+(n?" · "+n+" changes waiting":"")});
  const help=el("details",{class:"why"},el("summary",{text:"How to make the key"}),el("ol",{},
    el("li",{text:"github.com → profile picture → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token."}),
    el("li",{text:"Name: Calendar. Expiration: 1 year (or longer)."}),
    el("li",{text:"Repository access: Only select repositories → calendar-data."}),
    el("li",{text:"Permissions → Repository permissions → Contents: Read and write."}),
    el("li",{text:"Generate, copy the key (starts with github_pat_) and paste it here."})));
  const save=el("button",{type:"button",class:"btn primary",text:c.token?"Save + sync":"Connect",onclick:async()=>{const nc=Object.assign({},conf(),{repo:repo.value.trim(),token:tok.value.replace(/\s+/g,"")});setConf(nc);lastErr="";close();await sync();if(lastErr)openSync()}});
  const now=el("button",{type:"button",class:"btn",text:"Sync now",onclick:async()=>{close();await sync()}});
  const out=c.token?el("button",{type:"button",class:"btn danger",text:"Forget key on this device",onclick:()=>{const nc=conf();delete nc.token;setConf(nc);close();status()}}):null;
  sh.append(el("h2",{text:"Sync"}),info,el("label",{},"Private repository",repo),el("label",{},"Key",tok),hint,help,el("div",{class:"actions"},el("div",{class:"left"},out),c.token?now:null,el("button",{type:"button",class:"btn",text:"Close",onclick:close}),save));
  ov.appendChild(sh);document.body.appendChild(ov)}
function mount(){const u=document.getElementById("undoBtn");if(!u||document.getElementById("syncBtn"))return;
  const b=el("button",{class:"btn syncbtn",id:"syncBtn",type:"button",onclick:openSync});u.parentNode.insertBefore(b,u);status();
  if(!conf().token&&!Object.keys(mem.items||{}).length)setTimeout(openSync,400);else queueSync(200)}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",mount);else setTimeout(mount,0);
window.__store={sync,conf,setConf,mem,dirty};
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>

<style>

:root{
  --bg:#f2f4f1; --paper:#fbfcfa; --ink:#1d2622; --muted:#5f6b66; --line:#dde2dd; --line-strong:#c6cdc7;
  --accent:#2f6b5e; --accent-ink:#ffffff; --today:#e6efe9; --now:#c2412d; --danger:#b33a2a; --shadow:0 10px 30px rgba(20,30,25,.18);
  --c-study:#3b4fa8; --c-study-bg:#e3e7f7;
  --c-class:#4c5d74; --c-class-bg:#e2e7ee;
  --c-sport:#2f7a46; --c-sport-bg:#dcefe1;
  --c-ritual:#2e7a7a; --c-ritual-bg:#d8eeec;
  --c-meal:#9a6a14; --c-meal-bg:#f6ead0;
  --c-rest:#6e55a6; --c-rest-bg:#ebe4f6;
  --c-social:#b0405f; --c-social-bg:#f7e0e6;
  --c-creative:#b5571f; --c-creative-bg:#f8e3d5;
  --c-chores:#6b6153; --c-chores-bg:#ebe7e0;
  --c-travel:#55636b; --c-travel-bg:#e4e8ea;
  --c-sleep:#3d4566; --c-sleep-bg:#e1e3ec;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hour:48px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --paper:#181e1b; --ink:#e6ece8; --muted:#9aa7a1; --line:#29312d; --line-strong:#38423d;
  --accent:#7cc4b1; --accent-ink:#0f1513; --today:#1d2a25; --now:#ff7a62; --danger:#ff8a78; --shadow:0 10px 30px rgba(0,0,0,.5);
  --c-study:#aebcff; --c-study-bg:#262d4d; --c-class:#b9c6d8; --c-class-bg:#2a323d; --c-sport:#93d6a6; --c-sport-bg:#1f3a28;
  --c-ritual:#8fd6d0; --c-ritual-bg:#1c3836; --c-meal:#f0c878; --c-meal-bg:#3b3019; --c-rest:#cbb8f2; --c-rest-bg:#322a46;
  --c-social:#f3a1b7; --c-social-bg:#45232d; --c-creative:#f6b48a; --c-creative-bg:#46291a; --c-chores:#d4c9b8; --c-chores-bg:#36322b;
  --c-travel:#bfcad0; --c-travel-bg:#2c3236; --c-sleep:#b4bbe0; --c-sleep-bg:#272a3c; color-scheme:dark}}

  --bg:#121715; --paper:#181e1b; --ink:#e6ece8; --muted:#9aa7a1; --line:#29312d; --line-strong:#38423d;
  --accent:#7cc4b1; --accent-ink:#0f1513; --today:#1d2a25; --now:#ff7a62; --danger:#ff8a78; --shadow:0 10px 30px rgba(0,0,0,.5);
  --c-study:#aebcff; --c-study-bg:#262d4d; --c-class:#b9c6d8; --c-class-bg:#2a323d; --c-sport:#93d6a6; --c-sport-bg:#1f3a28;
  --c-ritual:#8fd6d0; --c-ritual-bg:#1c3836; --c-meal:#f0c878; --c-meal-bg:#3b3019; --c-rest:#cbb8f2; --c-rest-bg:#322a46;
  --c-social:#f3a1b7; --c-social-bg:#45232d; --c-creative:#f6b48a; --c-creative-bg:#46291a; --c-chores:#d4c9b8; --c-chores-bg:#36322b;
  --c-travel:#bfcad0; --c-travel-bg:#2c3236; --c-sleep:#b4bbe0; --c-sleep-bg:#272a3c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;max-width:1500px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.range{font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.grow{flex:1}
.brk{flex-basis:100%;height:0}

.unirow .ud{flex:0 0 74px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.unirow .ud.late{color:var(--danger);font-weight:600}
.unirow .ut{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.unirow.dl .ut{color:var(--danger);font-weight:600}
.unirow .uc{flex:0 0 auto;font-size:10.5px;font-weight:600;border-radius:999px;padding:1px 7px;background:var(--c-study-bg);color:var(--c-study);margin-top:1px}
.unirow.done .ut{text-decoration:line-through;color:var(--muted);font-weight:400}

<script>
(function(){
const CATS={study:"Study",class:"Class",sport:"Sport & movement",ritual:"Ritual",meal:"Meals",rest:"Rest",social:"Social",creative:"Creative & hobbies",chores:"Chores & admin",travel:"Travel",sleep:"Sleep"};
const THREADS=["Body","Mind","Creativity","Connection","Nature","Language","Home & life"];
const HORIZONS=[["season","Until February","Foundation for this semester"],["month","This month","Focus now"],["year","This year","Skills and projects for 2027"],["future","Next few years","Study, work and direction"],["dream","Dreams","One thread to pull"]];
const DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
let START_H=5;const END_H=24; // START_H moves earlier when something in view starts before 05:00
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const dayNum=s=>{const[y,m,d]=s.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const fromDayNum=n=>{const d=new Date(n*864e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())};
const isoDow=s=>((dayNum(s)%7)+7+3)%7+1;
const mondayOf=s=>fromDayNum(dayNum(s)-(isoDow(s)-1));
const addDays=(s,n)=>fromDayNum(dayNum(s)+n);
const mins=t=>{if(!t)return 0;const[h,m]=t.split(":").map(Number);return h*60+(m||0)};
const hm=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const fmtShort=s=>{const[y,m,d]=s.split("-").map(Number);return d+" "+MON[m-1]};
const newId=()=>"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function h(tag,props,...kids){const e=document.createElement(tag);if(props)for(const[k,v]of Object.entries(props)){if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e[k]=v;else if(v===true)e.setAttribute(k,"");else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}

const data={items:[],lists:[],goals:[],habits:[],weeks:[],recipes:[],settings:[],subs:[],subcache:[]};
let loaded=false, db=null, writable=true, needsRender=false;
let items=data.items;
let hidden=new Set((store("mc.hidden")||"").split(",").filter(Boolean));
let mode=store("mc.mode")||(window.innerWidth<760?"day":"week");
let view=store("mc.view")||"cal";
let cursor=todayStr();
let reviewOpen=false;

const lockedDl=it=>!!(it&&it.kind==="task"&&it.deadline&&!it.done&&it.date);
function dlLocked(it){if(!lockedDl(it))return false;toast("Official deadline: it stays on "+DOW[isoDow(it.date)-1]+" "+fmtShort(it.date)+". If the date really changed, edit it in the task.");return true}
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const el=h("div",{class:"toast",text:t});document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function clean(o){const c={};for(const[k,v]of Object.entries(o)){if(v===undefined||v===""||v===null)continue;if(k==="id"||k==="_src"||k==="_part")continue;c[k]=v}return c}
async function put(coll,obj){
  if(!db||!writable){toast("This calendar is read-only in this view.");return false}
  const id=obj.id||newId();
  try{await db.collection(coll).doc(id).set(clean(obj));return id}
  catch(e){if(e&&e.code==="invalid_argument"){writable=false;toast("View only.")}else if(e&&e.code==="quota_exceeded"){toast("The calendar is full. Delete some old items to add new ones.")}else{toast("Not saved. Check the connection.")}return false}
}
async function del(coll,id){try{await db.collection(coll).doc(id).delete();return true}catch(e){toast("Couldn't delete. Try again.");return false}}
const save=o=>put("items",o);
function planTask(date,title,from){return put("items",{kind:"task",date,title,notes:from})}

/* ---------- capacity: how much room a day really has ---------- */
const DAY_END_DEFAULT=22*60+30, LATEST_END=21*60+30, MIN_GAP=15, DEFAULT_MINS=30;
function fmtDur(m){m=Math.max(0,Math.round(m));if(m<60)return m+" min";const h0=Math.floor(m/60),r=m%60;return h0+"h"+(r?pad(r):"")}
function capacity(d){
  const t=todayStr(); if(d<t)return {past:true,free:0,flexMins:0,slots:[],level:"past"};
  const awayFull=spans("away",d).some(a=>(a.date<d||!a.start||mins(a.start)<=8*60)&&((a.endDate||a.date)>d||!a.end||mins(a.end)>=21*60));
  if(awayFull)return {away:true,free:0,flexMins:0,slots:[],level:"away"};
  const ev=eventsOn(d,true), mk=ev.find(o=>o.it.marker);
  const end=Math.min(mk?mins(mk.it.start):DAY_END_DEFAULT,LATEST_END); // nothing from the lists after 21:30: evenings stay for winding down
  const hard=ev.filter(o=>!o.it.marker&&!o.it.optional&&!o.it.flex);
  const flex=ev.filter(o=>!o.it.marker&&o.it.flex);
  const busy=hard.concat(flex).map(o=>[spanS(o),spanE(o)]);
  for(const a of spans("away",d)){busy.push([a.date===d&&a.start?mins(a.start):0,(a.endDate||a.date)===d&&a.end?mins(a.end):1440])}
  for(const b of subBusyOn(d))busy.push(b);
  busy.sort((a,b)=>a[0]-b[0]);
  let start=hard.length?Math.min(...hard.map(o=>mins(o.it.start))):8*60;

const esc=x=>String(x).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
function knownLocations(){const n={};for(const x of items)if(x.location){const k=x.location.trim();n[k]=(n[k]||0)+1}return Object.keys(n).sort((a,b)=>n[b]-n[a]||a.localeCompare(b)).slice(0,40)}
function openEditor(it,occDate){if(it&&it._src)it=it._src;
  const isNew=!it.id;const kind=it.kind||"event";const r=it.repeat||null;
  const ov=document.createElement("div");ov.className="overlay";
  const sh=document.createElement("form");sh.className="sheet";sh.setAttribute("aria-label","Edit");
  const catOpts=Object.entries(CATS).map(([k,v])=>'<option value="'+k+'"'+((it.cat||"study")===k?" selected":"")+'>'+v+'</option>').join("");
  const dayBoxes=DOW.map((d,i)=>'<label><input type="checkbox" name="d'+(i+1)+'"'+(r&&r.days.includes(i+1)?" checked":(!r&&it.date&&isoDow(it.date)===i+1?" checked":""))+'> '+d+'</label>').join("");
  sh.innerHTML=
   '<h2>'+(isNew?"Add":"Edit")+'</h2>'+
   '<div class="kinds seg" role="group" aria-label="Type">'+
     ['event','task','away','allday'].map(k=>'<button type="button" data-k="'+k+'" aria-pressed="'+(kind===k)+'">'+({event:"Block",task:"Task",away:"Trip / away",allday:"Day note"})[k]+'</button>').join("")+'</div>'+
   '<label>Title<input type="text" id="f-title" required></label>'+
   '<div class="row"><label class="k-event k-task k-away k-allday">Date<input type="date" id="f-date"></label>'+
     '<label class="k-event k-away k-allday" id="f-endLbl"><span id="f-endTxt">Until</span><input type="date" id="f-endDate"></label></div>'+
   '<div class="row k-event k-away"><label>Start<input type="time" id="f-start" step="60"></label><label>End<input type="time" id="f-end" step="60"></label></div>'+
   '<div class="row k-task"><label>Time (optional)<input type="time" id="f-time" step="60"></label><label class="inline" style="align-self:end"><input type="checkbox" id="f-deadline"> Deadline</label><label class="inline" style="align-self:end"><input type="checkbox" id="f-uni"> University</label></div>'+
   '<div class="locrow k-event k-away"><label>Location<input type="text" id="f-loc" list="f-locs" autocomplete="off" placeholder="Place or address"></label><a id="f-map" target="_blank" rel="noopener" hidden>Open in Maps</a></div>'+
   '<div class="k-event trvrow"><span class="wk-label">Travel time</span><div class="trvf"><label>Before<input type="number" id="f-tb" min="0" step="5" inputmode="numeric" placeholder="0"></label><label>After<input type="number" id="f-ta" min="0" step="5" inputmode="numeric" placeholder="0"></label><label>By<select id="f-tm"><option value="ebike">E-bike</option><option value="bike">Bike</option><option value="walk">Walk</option><option value="car">Car</option><option value="transit">Train / tram</option></select></label><button type="button" class="btn sm" id="f-tcalc">Calculate</button></div><p class="why" id="f-tinfo" style="margin:2px 0 0"></p></div><datalist id="f-locs">'+knownLocations().map(x=>'<option value="'+esc(x)+'"></option>').join("")+'</datalist>'+
   '<label class="k-event">Category<select id="f-cat">'+catOpts+'</select></label>'+
   '<div class="k-event"><label>Repeat<select id="f-repeat"><option value="0">Doesn\'t repeat</option><option value="1">Every week</option><option value="2">Every other week</option></select></label></div>'+
   '<div class="k-event rep"><div class="days">'+dayBoxes+'</div></div>'+
   '<div class="row k-event rep"><label>Repeat from<input type="date" id="f-from"></label><label>Repeat until<input type="date" id="f-until"></label></div>'+
   '<div class="k-event"><label class="inline"><input type="checkbox" id="f-optional"> Maybe (see-through, does not block time)</label></div>'+
   '<div class="k-event"><label class="inline"><input type="checkbox" id="f-marker"> Time mark only (no duration, e.g. lights out)</label></div>'+
   '<div class="k-event"><label class="inline"><input type="checkbox" id="f-flex"> Flexible time: tasks from my lists may go here</label></div>'+
   '<label>Notes<textarea id="f-notes"></textarea></label>'+
   (occDate?'<div class="note">This block is part of a routine. Saving changes the whole routine. Use "Only this day" to change just '+DOW[isoDow(occDate)-1]+' '+fmtShort(occDate)+'.</div>':'')+
   '<div class="actions"><div class="left"></div><button type="button" class="btn" id="f-cancel">Cancel</button><button type="submit" class="btn primary" id="f-save">Save</button></div>';
  ov.appendChild(sh);document.body.appendChild(ov);
  let k=kind;
  const f=id=>sh.querySelector("#f-"+id);
  f("title").value=it.title||"";f("date").value=occDate||it.date||cursor;f("endDate").value=it.endDate||"";
  f("start").value=it.start||"09:00";f("end").value=it.end||"10:00";f("time").value=it.time||"";f("deadline").checked=!!it.deadline;f("uni").checked=isUni(Object.assign({kind:"task"},it));
  f("repeat").value=r?String(r.every||1):"0";f("from").value=r?(r.from||""):"";f("until").value=r?(r.until||""):"";
  f("loc").value=it.location||"";const syncMap=()=>{const v=f("loc").value.trim();const a=sh.querySelector("#f-map");a.hidden=!v;if(v)a.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(v)};f("loc").addEventListener("input",syncMap);syncMap();f("optional").checked=!!it.optional;f("marker").checked=!!it.marker;f("flex").checked=!!it.flex;f("notes").value=it.notes||"";
  function sync(){
    sh.querySelectorAll(".kinds button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));
    sh.querySelectorAll(".k-event,.k-task,.k-away,.k-allday").forEach(el=>{el.hidden=!el.classList.contains("k-"+k)});
    const rep=f("repeat").value!=="0";
    if(k==="event"){sh.querySelectorAll(".rep").forEach(el=>el.hidden=!rep);sh.querySelectorAll(".norep").forEach(el=>el.hidden=rep);if(rep)sh.querySelector("#f-endLbl").hidden=true}
    sh.querySelector("#f-endTxt").textContent=k==="event"?"Ends on (later day)":"Until";
  }
  sh.querySelectorAll(".kinds button").forEach(b=>b.onclick=()=>{k=b.dataset.k;sync()});
  f("repeat").onchange=sync;sync();syncMap();sh.querySelectorAll(".kinds button").forEach(b=>b.addEventListener("click",syncMap));
  f("tb").value=it.travelBefore||"";f("ta").value=it.travelAfter||"";f("tm").value=it.travelMode||"ebike";
  f("tcalc").onclick=async()=>{const info=sh.querySelector("#f-tinfo");const dest=f("loc").value.trim();if(!dest){info.textContent="Add a location first.";return}
    const mode=f("tm").value;if(mode==="transit"){info.innerHTML="";info.append("Train / tram can't be calculated here: ",h("a",{href:"https://www.google.com/maps/dir/?api=1&travelmode=transit&destination="+encodeURIComponent(dest),target:"_blank",rel:"noopener",text:"check it in Maps"})," and fill in the minutes.");return}
    const home=travelHome();if(!home){const inp=h("input",{type:"text",placeholder:"Home address (start point), e.g. street + number, Elsene"});const ok=h("button",{type:"button",class:"btn sm",text:"Save",onclick:async()=>{if(inp.value.trim()){await setCfg("travel",{home:inp.value.trim()});f("tcalc").click()}}});info.innerHTML="";info.append(inp,ok);inp.focus();return}
    const date=f("date").value,st=mins(f("start").value),en=mins(f("end").value);const near=travelNeighbours(it.id,date,st,en);
    info.textContent="Calculating…";
    try{const a=await travelMinutes(near.from||home,dest,mode),b=await travelMinutes(dest,near.to||home,mode);
      if(a==null&&b==null){info.textContent="Couldn't find this place on the map. Fill in the minutes yourself.";return}
      if(a!=null)f("tb").value=a;if(b!=null)f("ta").value=b;
      info.textContent="From "+(near.from||"home")+" · back to "+(near.to||"home")+" · "+f("tm").selectedOptions[0].text.toLowerCase()+" (OpenStreetMap)"}
    catch(e){info.textContent=navigator.onLine?"The route service didn't answer. Fill in the minutes yourself.":"Offline: fill in the minutes yourself."}};
  const close=()=>{ov.remove();if(needsRender){needsRender=false;render()}};
  ov.addEventListener("click",e=>{if(e.target===ov)close()});
  f("cancel").onclick=close;
  function collect(){
    const o={id:it.id,kind:k,title:f("title").value.trim(),date:f("date").value,notes:f("notes").value.trim()};
    for(const key of ["with","fromList","fromItem"])if(it[key]!==undefined)o[key]=it[key];
    if(k==="event"||k==="away"){const lv=f("loc").value.trim();if(lv)o.location=lv}
    if(k==="event"){const tb=parseInt(f("tb").value,10),ta=parseInt(f("ta").value,10);if(tb>0)o.travelBefore=Math.min(tb,600);if(ta>0)o.travelAfter=Math.min(ta,600);if(tb>0||ta>0)o.travelMode=f("tm").value;
      o.start=f("start").value;o.end=f("end").value;o.cat=f("cat").value;o.optional=f("optional").checked||undefined;o.marker=f("marker").checked||undefined;o.flex=f("flex").checked||undefined;if(o.marker)o.end=hm(Math.min(mins(o.start)+1,1439));
      const ev=Number(f("repeat").value);
      if(ev){const ds=DOW.map((_,i)=>i+1).filter(i=>sh.querySelector('[name=d'+i+']').checked);
        o.repeat={days:ds.length?ds:[isoDow(o.date)],every:ev,from:f("from").value||(r&&r.from)||o.date,until:f("until").value||undefined,except:(r&&r.except)||[]};
        if(!o.repeat.until)delete o.repeat.until;o.date=undefined}
      else{delete o.replaces;const ed=f("endDate").value;if(ed&&ed>o.date)o.endDate=ed;else if(!o.marker&&mins(o.end)<mins(o.start))o.endDate=addDays(o.date,1)}}
    if(k==="task"){o.time=f("time").value||undefined;o.deadline=f("deadline").checked||undefined;o.done=it.done||undefined;for(const key of ["week","order","mins"])if(it[key]!==undefined&&!o.date)o[key]=it[key];const u=f("uni").checked;if(u!==UNI_RE.test(o.title))o.uni=u;else delete o.uni}
    if(k==="away"||k==="allday"){o.endDate=f("endDate").value||undefined;if(k==="away"){o.start=f("start").value;o.end=f("end").value}}
    return o}
  function valid(o){if(!o.title){toast("Add a title first.");return false}if(!o.date&&!o.repeat){toast("Pick a date.");return false}
    if(o.kind==="event"&&!o.marker&&!o.endDate&&(o.repeat?mins(o.end)===mins(o.start):mins(o.end)<=mins(o.start))){toast("End time must be after the start time.");return false}return true}
  sh.addEventListener("submit",async e=>{e.preventDefault();const o=collect();if(!valid(o))return;const before=isNew?null:snapIt(it);const id=await save(o);if(id){close();pushUndo((isNew?"Added “":"Saved “")+o.title+"”",()=>before?save(before):del("items",id))}});
  const left=sh.querySelector(".actions .left");
    if(!isNew&&kind==="event"&&(it.cat==="meal"||mealOfBlock(it.title))){const pr=h("button",{type:"button",class:"btn primary",text:"Pick a recipe"});
    pr.onclick=()=>{const d=occDate||it.date;ov.remove();openRecipePicker({it,isRoutine:!!it.repeat},d)};left.appendChild(pr)}
  if(!isNew&&!it.repeat&&(kind==="task"||kind==="event")&&!it.marker){
    const mv=h("button",{type:"button",class:"btn",text:"Move: next day with room"});mv.onclick=async()=>{if(await moveNext(it))close()};
    const tm=h("button",{type:"button",class:"btn",text:"Tomorrow"});tm.onclick=async()=>{if(await moveTo(it,addDays(todayStr()>(it.date||"")?todayStr():it.date,1)))close()};
    left.append(tm,mv);
    if(kind==="task"&&it.date){const wk=h("button",{type:"button",class:"btn",text:"To week list"});wk.onclick=async()=>{if(await taskToWeek(it,mondayOf(it.date)))close()};left.appendChild(wk)}}
  if(occDate&&it.repeat){
    const skip=h("button",{type:"button",class:"btn",text:"Skip this day"});
    skip.onclick=async()=>{const rr=Object.assign({},it.repeat,{except:[...(it.repeat.except||[]),occDate]});const before=snapIt(it);if(await save(Object.assign({},it,{repeat:rr}))){close();pushUndo("Skipped “"+it.title+"” on "+fmtShort(occDate),()=>save(before))}};
    const only=h("button",{type:"button",class:"btn",text:"Only this day"});
    only.onclick=async()=>{const o=collect();if(!o.title){toast("Add a title first.");return}
      const one={kind:"event",title:o.title,date:occDate,start:o.start,end:o.end,cat:o.cat,notes:o.notes,optional:o.optional};
      if(mins(one.end)<=mins(one.start)){toast("End time must be after the start time.");return}
      const rr=Object.assign({},it.repeat,{except:[...(it.repeat.except||[]),occDate]});
      const before=snapIt(it);let cid;if(await save(Object.assign({},it,{repeat:rr}))&&(cid=await save(one))){close();pushUndo("Changed “"+it.title+"” for "+fmtShort(occDate),async()=>{await del("items",cid);return save(before)})}};
    left.append(skip,only)}
  if(!isNew){const cpb=h("button",{type:"button",class:"btn",text:"Copy"});cpb.onclick=()=>{ov.remove();render();copyItem(it)};left.appendChild(cpb)}
  if(!isNew){
    const d=h("button",{type:"button",class:"btn danger",text:it.repeat?"Delete routine":"Delete"});
    d.onclick=async()=>{
      const before=snapIt(it);if(await del("items",it.id)){close();pushUndo("Deleted “"+it.title+"”",()=>save(before))}};left.appendChild(d)}
  setTimeout(()=>f("title").focus(),30);
}

/* ---------- controls ---------- */
const step=()=>(view==="habits"||mode==="week")?7:1;
const monthStep=n=>{const f=addMonths(cursor,n);cursor=todayStr().slice(0,7)===f.slice(0,7)?todayStr():f};
$("prev").onclick=()=>{if(view==="cal"&&mode==="month")monthStep(-1);else cursor=addDays(cursor,-step());render()};
$("next").onclick=()=>{if(view==="cal"&&mode==="month")monthStep(1);else cursor=addDays(cursor,step());render()};
$("undoBtn").onclick=()=>doUndo();
$("today").onclick=()=>{cursor=todayStr();render();if(view==="cal")scrollToNow()};
$("jump").addEventListener("click",e=>{try{e.target.showPicker&&e.target.showPicker()}catch(_){}});
$("jump").onchange=e=>{if(e.target.value){cursor=e.target.value;render()}};
const vWeek=$("vWeek"),vDay=$("vDay"),vMonth=$("vMonth");
vMonth.onclick=()=>{mode="month";store("mc.mode",mode);render()};
vWeek.onclick=()=>{mode="week";store("mc.mode",mode);render()};
vDay.onclick=()=>{mode="day";store("mc.mode",mode);render()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;store("mc.view",view);render()});
$("addBtn").onclick=()=>openQuick({date:mode!=="week"?cursor:(days().includes(todayStr())?todayStr():days()[0])});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&popEl){popCancel();return}if(e.key==="Escape"){const o=document.querySelectorAll(".overlay");if(!o.length&&clip){clip=null;renderClip();return}if(o.length){o[o.length-1].remove();if(dragging){dragging=false;needsRender=true}if(needsRender){needsRender=false;render()}}}});
/* ---------- sideways swipe / scroll: previous or next week, day, month ---------- */
function navStep(dir){
  if(view!=="cal")return;
  if(mode==="month")monthStep(dir);else cursor=addDays(cursor,dir*step());
  render();
  const sc=$("scroller");if(mode!=="month")return;
  const g=sc.firstElementChild;if(g){g.classList.remove("slide-l","slide-r");void g.offsetWidth;g.classList.add(dir>0?"slide-l":"slide-r")}
}
(function(){
  const sc=$("scroller"),area=$("view-cal");let sx=0,sy=0,sl=0,st=0,on=false,inSc=false;
  const maxL=()=>Math.max(0,sc.scrollWidth-sc.clientWidth);
  area.addEventListener("touchstart",e=>{if(e.touches.length!==1||e.target.closest(".strip,.legend,input,textarea,select,.overlay,#clipbar")){on=false;return}const t=e.touches[0];sx=t.clientX;sy=t.clientY;inSc=!!e.target.closest("#scroller");sl=inSc?sc.scrollLeft:-1;st=Date.now();on=true},{passive:true});
  area.addEventListener("touchmove",e=>{if(e.touches.length!==1)on=false},{passive:true});
  area.addEventListener("touchend",e=>{if(!on)return;on=false;if(mode!=="month")return;
    if(view!=="cal"||dragging||Date.now()-lastDragEnd<400||document.querySelector(".overlay"))return;
    const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<70||Math.abs(dx)<1.6*Math.abs(dy)||Date.now()-st>900)return;
    if(dx<0&&(!inSc||sl>=maxL()-2))navStep(1);else if(dx>0&&(!inSc||sl<=2))navStep(-1);
  },{passive:true});
  let acc=0,lastW=0,cool=0;
  sc.addEventListener("wheel",e=>{
    if(view!=="cal"||mode!=="month"||dragging||Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;
    const now=Date.now();if(now<cool)return;if(now-lastW>350)acc=0;lastW=now;
    const atR=sc.scrollLeft>=maxL()-2,atL=sc.scrollLeft<=2;
    if((e.deltaX>0&&atR)||(e.deltaX<0&&atL)){acc+=e.deltaX;if(Math.abs(acc)>180){const d=acc>0?1:-1;acc=0;cool=now+800;navStep(d)}}else acc=0;
  },{passive:true});
})();
function scrollToNow(){const target=document.querySelector(".col");if(target){const hr=new Date().getHours();const y=target.getBoundingClientRect().top+window.scrollY+Math.max(0,hr-START_H-1)*hourPxNow()-120;window.scrollTo({top:Math.max(0,y),behavior:"smooth"})}}
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(requestRender,150)});
setInterval(()=>{if(loaded&&view==="cal")requestRender()},5*60*1000);
setInterval(()=>{if(loaded&&!document.hidden)refreshSubs(false)},10*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&loaded)refreshSubs(false)});

render();
(async()=>{
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){render();return}
  try{const u=await window.claude.use("user");if(u&&u.can){const c=await u.can("data.write");if(c===false)writable=false}}catch(e){}
  const COLLS=["items","lists","goals","habits","weeks","recipes","settings","subs","subcache"];let pending=new Set(COLLS);
  for(const coll of COLLS){
    db.collection(coll).onSnapshot(snap=>{data[coll]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(coll==="items")items=data.items;
      const wasLoaded=loaded;pending.delete(coll);if(!pending.size)loaded=true;
      if(loaded){requestRender();if(!wasLoaded){if(view==="cal")setTimeout(scrollToNow,60);setTimeout(()=>refreshSubs(true),400)}}},
      ()=>{loaded=true;toast("The calendar stopped syncing. Reload the page to reconnect.")});
  }
})();
})();
